name: Dependabot Failure Watcher

# Fails if a Dependabot version-update run failed in the last 8 days. A broken
# ecosystem then shows up as a red scheduled run, not as a red triangle in the
# Dependabot tab that nobody checks.
#
# Security-update runs at the repo root and in e2e/ are excluded. They often
# fail in ways no pull request can fix: the advisory is against a dependency
# this project does not declare directly, or no patched version is reachable.
# Counting them would keep this workflow red and teach everyone to ignore it.
#
# What the filter must separate
#
# GitHub uses one workflow name, "Dependabot Updates", for three kinds of run:
#
#   1. Scheduled scan. One run for each dependabot.yml entry. It opens or
#      updates pull requests. If it breaks, the ecosystem stops updating and
#      nothing else tells anyone. This is the main kind to catch.
#   2. Per-pull-request refresh. One run for each open Dependabot pull request.
#      A push to the base branch, a rebase, or an "@dependabot recreate"
#      comment starts it, so runs come in bursts after merges. A failure means
#      one pull request is stale.
#   3. Security update. One run for each vulnerable package. A Dependabot alert
#      starts it. It needs no dependabot.yml entry, but that file can
#      configure it.
#
# Only the run title (displayTitle) tells the kinds apart. The event,
# headBranch, and actor fields are identical. Titles have these shapes:
#
#   Title                                    Kind
#   "<eco> in /."                            1, repo root (no " for " suffix)
#   "<eco> in <configured-dir>"              1, elsewhere
#   "<eco> in / for <deps>"                  2, repo root
#   "<eco> in <configured-dir> for <deps>"   2, elsewhere
#   "<eco> in /. for <one-dep>"              3, repo root
#   "<eco> in <manifest-dir> for <one-dep>"  3, elsewhere (the directory where
#                                            the manifest was found)
#
# The jq filter below drops two title patterns:
#
#   " in /. for "             Kind 3 at the repo root (root security updates).
#   " in /e2e/(js|ts) for "   Kind 3 for the e2e dev dependencies.
#
# BOTH HALVES of " in /. for " are required. Matching " in /." alone would also
# drop every kind 1 run at the root. Those are most of the runs, and they are
# the runs this watcher exists to catch.
#
# Outside the root, a title cannot tell kind 2 from kind 3, so the e2e clause
# names directories. e2e/js and e2e/ts hold consumer smoke tests. Their
# transitive dev dependencies attract advisories that no pull request can fix,
# and none of that code ships. All version updates run at the root (see
# dependabot.yml), so no kind 2 title names an e2e directory. If dependabot.yml
# gets an entry for an e2e directory, this clause also hides its kind 2
# failures. The ecosystem label cannot help: Dependabot writes "npm_and_yarn"
# for both kinds.
#
# The filter is a denylist, not an allowlist read from dependabot.yml. An entry
# there can be a glob, such as directories: ["**/*"], and a glob never matches a
# title literally. An allowlist would then drop real failures without a sign. A
# stale denylist only adds noise, and noise is loud.
#
# Limits:
#
#   - GitHub disables scheduled workflows after 60 days without repository
#     activity.
#   - A failed scheduled run emails the person who last edited the cron entry
#     below.
#   - The workflow runs entirely within this repository and uses no external
#     service.
#   - The other Node client repositories share this workflow. Edit the copies
#     together.

on:
  schedule:
    - cron: "17 14 * * 3" # Wednesdays 14:17 UTC
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check-dependabot-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any Dependabot version update failed in the last 8 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # --created filters server-side, so --limit applies to runs already
          # narrowed to the window rather than to all of history. Runs come back
          # newest-first, so reaching the limit would drop the oldest in-window
          # runs and this step would report all-clear without them -- hence a
          # limit far above any plausible week's worth of runs.
          runs=$(gh run list \
            --repo "$REPO" \
            --workflow "Dependabot Updates" \
            --created ">=$since" \
            --limit 500 \
            --json conclusion,createdAt,displayTitle,url)
          failures=$(echo "$runs" | jq '
            [.[]
             | select((.displayTitle | contains(" in /. for ")) | not)
             | select((.displayTitle | test(" in /e2e/(js|ts) for ")) | not)
             | select(.conclusion == "failure"
                   or .conclusion == "startup_failure"
                   or .conclusion == "timed_out")]')
          count=$(echo "$failures" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "::error::$count failed Dependabot version update run(s) in the last 8 days:"
            echo "$failures" | jq -r '.[] | "- \(.displayTitle) (\(.createdAt))\n  \(.url)"'
            exit 1
          fi
          echo "No failed Dependabot version update runs in the last 8 days."
